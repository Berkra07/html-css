<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 015(tabelasa)</title>
</head>
<body>
    <h1>Tabela de Notas e Média estudantil</h1>

                <th scope="colgroup" rowspan="4">Exatas</th>

                <td>Astrologia</td>

                <td>9.5</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>6.7</td>
                <td>3.7</td>
                <td>5.2</td>
            </tr>
            <tr>
                <th scope="col" colspan="4">Media de Exatas</th>
                <td>7.7</td>
            </tr>
            <tr>
                <th scope="colgroup" rowspan="2">Humanas</th>
                <td>Historia</td>

                <td>9.9</td>

            </tr>
            <tr>
                <th scope="col" colspan="4">Media Humanas</th>
                <td>8.0</td>
            </tr>
        </tbody>
    </Table>
</body>
</html>
