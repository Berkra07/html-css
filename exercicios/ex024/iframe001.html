<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de ifrime</title>
    <style>
        iframe{
            width: 600px;
            height: 400px;
        }
    </style>
</head>
<body>
    <!--Iframe serve para colocar site dentro de outro site ( com algumas resalvas.)-->
    <h1>Testa o uso de Iframe</h1>
    <p>acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com/" frameborder="0"></iframe>
        
        para aprender a programar
    </p>
    <!-- isso nao funciona para todos os tipos de sites como no exempolo a baixo-->
    <p>
        O site do <iframe src="https://www.google.com.br/?hl=pt-BR" frameborder="0"></iframe> tambem é muito legal
    </p>
    <p>
        O Meu 
        <iframe src="https://github.com/Berkra07" frameborder="0">
            github
        </iframe>
        tambem é muito legal
    </p>
</body>
</html>
