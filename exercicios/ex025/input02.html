<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aprendendo input aula 2</title>
   
  </head>
  <body>
    <!-- input color serve para colocar uma cor-->
    <input type="color" />
    <!-- input range serve para colocar uma barra de valor(volume)-->
    <input type="range" min="0" max="100" step="1" value="50" />
    <!-- input password serve para colocar uma senha-->
    <input type="password" placeholder="Digite sua senha" />
    <label for="">
        <!-- input checkbox serve para marcar ou desmarcar uma opção -->
        <input type="checkbox">
    </label>
    <!--O FILE SERVE PARA ENVIAR ARQUIVOS-->
    <input type="file">
    <!--O DATE SERVE PARA ESCOLHER UMA DATAS-->
    <input type="date"/>
    <!--Input radio serve para marcar + de uma opção-->
    <input type="datetime">
    <!--input type datetime (data e horario)-->
    <input type="radio" name="1" value="opcao1"> Opção 1
    <input type="radio" name="2" value="opcao2"> Opção 2
    <!-- input tipe number serve apenas para numeros-->
    <input type="number">
</html>
