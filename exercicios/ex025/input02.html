<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aprendendo input aula 2</title>
    <style>
              body {
                  font-family: Arial, sans-serif;
                  margin: 20px;
              }
              input {
                  display: block;
                  margin-bottom: 10px;
              }
    </style>
  </head>
  <body>
    <!-- input color serve para colocar uma cor-->
    <input type="color" />
    <!-- input range serve para colocar uma barra de valor(volume)-->
    <input type="range" min="0" max="100" step="1" value="50" />
    <!-- input password serve para colocar uma senha-->
    <input type="password" placeholder="Digite sua senha" />
  </body>
</html>
